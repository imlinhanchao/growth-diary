name: Build APK APP

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Get version
      id: version
      run: |
        VERSION=$(grep '^version: ' pubspec.yaml | sed 's/version: //')
        
        # 分离版本号和构建号
        VERSION_NAME=$(echo $VERSION | cut -d'+' -f1)
        BUILD_NUMBER=$(echo $VERSION | cut -d'+' -f2)
        echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
        echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.38.9'
        channel: 'stable'

    - name: Cache Flutter dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.pub-cache
        key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
        restore-keys: |
          ${{ runner.os }}-pub-

    - name: Get Flutter dependencies
      run: flutter pub get

    - name: Run Flutter analyze
      run: flutter analyze

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Decode keystore
      env:
          ANDROID_RELEASE_KEY: ${{ secrets.ANDROID_RELEASE_KEY }}
      run: |
        echo "$ANDROID_RELEASE_KEY" | base64 --decode > android/app/growth-keystore.p12

    - name: Build APK
      run: |
        export ANDROID_KEYSTORE_PASSWORD="${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}"
        flutter build apk --release

    - name: Rename APK with version
      run: |
        VERSION_NAME="${{ steps.version.outputs.version_name }}"
        if [ "$VERSION_NAME" = "nightly" ] || [ -z "$VERSION_NAME" ]; then
          VERSION_NAME="nightly-$(date +%Y%m%d-%H%M%S)"
        fi
        mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/growth-diary-${VERSION_NAME}.apk"

    - name: Upload APK via SCP
      if: secrets.SSH_HOST != ''
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SSH_HOST }}
        username: ${{ secrets.SSH_USER }}
        key: ${{ secrets.SSH_KEY }}
        source: "build/app/outputs/flutter-apk/growth-diary-${{ steps.version.outputs.version_name }}.apk"
        target: "${{ secrets.SSH_PATH }}/${{ secrets.ReleaseName != '' && format('{0}.apk', secrets.ReleaseName) || format('growth-diary-{0}.apk', steps.version.outputs.version_name) }}"

    - name: Create draft release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        draft: true
        prerelease: false
        generate_release_notes: true
        tag_name: v${{ steps.version.outputs.version_name }}
        release_name: "Release v${{ steps.version.outputs.version_name }}"

    - name: Upload APK to release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: build/app/outputs/flutter-apk/growth-diary-${{ steps.version.outputs.version_name }}.apk
        asset_name: growth-diary-${{ steps.version.outputs.version_name }}.apk
        asset_content_type: application/vnd.android.package-archive
