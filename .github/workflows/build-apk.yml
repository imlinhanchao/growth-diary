name: Build and Release APK

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Release version name (e.g., v1.0.0)'
        required: false
        default: 'nightly'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Build APK
      uses: cedvdb/action-flutter-build-android@v1
      with:
        keystore-base64: ${{ secrets.ANDROID_RELEASE_KEY }}
        keystore-password: "${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}"
        # optionals
        build-cmd: flutter build apk --release
        working-directory: ./

    - name: Rename APK with version
      run: |
        VERSION_NAME="${{ github.event.inputs.version_name }}"
        if [ "$VERSION_NAME" = "nightly" ] || [ -z "$VERSION_NAME" ]; then
          VERSION_NAME="nightly-$(date +%Y%m%d-%H%M%S)"
        fi
        ls build/app/outputs/flutter-apk/
        mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/growth-diary-${VERSION_NAME}.apk"

    - name: Create draft release
      id: create_release
      uses: actions/create-release@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        draft: true
        prerelease: false
        generate_release_notes: true
        tag_name: ${{ github.event.inputs.version_name }}
        release_name: "Release ${{ github.event.inputs.version_name }}"

    - name: Upload APK to release
      uses: actions/upload-release-asset@v1
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        upload_url: ${{ steps.create_release.outputs.upload_url }}
        asset_path: build/app/outputs/flutter-apk/growth-diary-${{ github.event.inputs.version_name }}.apk
        asset_name: growth-diary-${{ github.event.inputs.version_name }}.apk
        asset_content_type: application/vnd.android.package-archive